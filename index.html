<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of Alex Ruiz Castillo, featuring selected projects and professional experience." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Alex Ruiz Castillo" />
    <meta property="og:description" content="Portfolio of Alex Ruiz Castillo, featuring selected projects and professional experience." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://aruizcastillo.com/" />
    <title>Alex Ruiz Castillo</title>
    <script>
      ;(() => {
        // Setting the theme early to avoid a flash or incorrect theme on page load.
        let storedTheme = null
        // Setting the document language early for accessibility and browser semantics.
        let storedLocale = null
        // Setting the style early to avoid a flash or incorrect style on page load.
        let storedStyle = null

        try {
          storedTheme = localStorage.getItem('theme')
          storedLocale = localStorage.getItem('locale')
          storedStyle = localStorage.getItem('style')
        } catch {
          // Storage can be unavailable in private browsing contexts.
        }

        // Add new themes, styles, or locales here if you add them to the app.
        const theme = ['system', 'light', 'dark'].includes(storedTheme) ? storedTheme : 'system'
        const style = ['soft', 'sharp'].includes(storedStyle) ? storedStyle : 'soft'
        const systemTheme = typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        const resolvedTheme = theme === 'system' ? systemTheme : theme
        const browserLocale = navigator.language.split('-')[0]
        const locale = ['en', 'es'].includes(storedLocale) ? storedLocale : ['en', 'es'].includes(browserLocale) ? browserLocale : 'en'

        document.documentElement.dataset.theme = resolvedTheme
        document.documentElement.dataset.style = style
        document.documentElement.style.colorScheme = resolvedTheme
        document.documentElement.lang = locale
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
